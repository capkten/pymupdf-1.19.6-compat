name: Build Linux wheels

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["compat-v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.arch }} wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: Check out PyMuPDF compatibility source
        uses: actions/checkout@v4

      - name: Enable aarch64 container execution
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test manylinux wheels
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-*
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: bash {project}/ci/linux/build-mupdf.sh
          CIBW_ENVIRONMENT_LINUX: PYMUPDF_DIRS=/opt/mupdf/pymupdf-dirs.json
          CIBW_TEST_REQUIRES: pytest==8.3.5
          CIBW_TEST_COMMAND: >-
            python -c "import fitz; assert fitz.VersionBind == '1.19.6';
            assert fitz.VersionFitz == '1.19.0'"
            && python -m pytest {project}/tests -q
          CIBW_REPAIR_WHEEL_COMMAND: auditwheel repair -w {dest_dir} {wheel}
        run: |
          python -m pip install --upgrade pip cibuildwheel==2.21.3
          python -m cibuildwheel --output-dir wheelhouse

      - name: Inspect wheel contents and metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          test "${#wheels[@]}" -eq 3
          for wheel in "${wheels[@]}"; do
            python -m zipfile -l "$wheel" | grep -E 'fitz/(_fitz|fitz).*\.(so|py)$'
            auditwheel show "$wheel"
            sha256sum "$wheel"
          done

      - name: Upload wheels and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PyMuPDF-1.19.6-linux-${{ matrix.arch }}
          path: |
            wheelhouse/*.whl
            ci/versions.json
            mupdf-build.log
          if-no-files-found: warn
