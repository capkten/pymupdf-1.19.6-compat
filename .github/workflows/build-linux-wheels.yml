name: Build Linux wheels

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["compat-v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.arch }} wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: Check out PyMuPDF compatibility source
        uses: actions/checkout@v4

      - name: Enable aarch64 container execution
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test manylinux wheels
        env:
          CIBW_BUILD: cp310-manylinux_* cp311-manylinux_* cp312-manylinux_*
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: bash {project}/ci/linux/build-mupdf.sh
          CIBW_BEFORE_BUILD_LINUX: >-
            python -m pip install "swig==4.0.2" setuptools wheel
            && bash {project}/ci/linux/build-python-extension.sh
          CIBW_ENVIRONMENT_LINUX: PYMUPDF_DIRS=/opt/mupdf/pymupdf-dirs.json
          CIBW_TEST_REQUIRES: pytest==8.3.5
          CIBW_TEST_COMMAND: bash {project}/ci/linux/test-wheel.sh
          CIBW_REPAIR_WHEEL_COMMAND: auditwheel repair -w {dest_dir} {wheel}
        run: |
          python -m pip install --upgrade pip cibuildwheel==2.21.3
          python -m cibuildwheel --output-dir wheelhouse

      - name: Inspect wheel contents and metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=Linux wheel inspection::line=${LINENO} command=${BASH_COMMAND}"' ERR
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          printf 'WHEELS=%s\n' "${wheels[*]}"
          test "${#wheels[@]}" -eq 3
          for wheel in "${wheels[@]}"; do
            echo "INSPECT=$wheel"
            python -c "import sys, zipfile; names=zipfile.ZipFile(sys.argv[1]).namelist(); assert any(n.startswith('fitz/_fitz') and n.endswith('.so') for n in names); assert 'fitz/__init__.py' in names" "$wheel"
            case "$wheel" in
              *manylinux2014_${{ matrix.arch }}.whl) ;;
              *) echo "Unexpected Linux wheel tag: $wheel" >&2; exit 1 ;;
            esac
            sha256sum "$wheel"
          done

      - name: Upload wheels and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PyMuPDF-1.19.6-linux-${{ matrix.arch }}
          path: |
            wheelhouse/*.whl
            ci/versions.json
            mupdf-build.log
            python-build.log
            pytest-*.log
            current-test.txt
          if-no-files-found: warn
