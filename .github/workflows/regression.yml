name: Regression tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-syntax:
    runs-on: windows-2022
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - run: python -m compileall -q fitz
