name: Build Windows wheels

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out PyMuPDF compatibility source
        uses: actions/checkout@v4

      - name: Check out pinned MuPDF source
        uses: actions/checkout@v4
        with:
          repository: ArtifexSoftware/mupdf
          ref: 5f966a513775dcc95e999c988a02eeca7697fe2b
          submodules: recursive
          path: mupdf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Build wheel
        shell: pwsh
        run: .\ci\windows\build-wheel.ps1 -Python (Get-Command python).Source

      - name: Inspect wheel metadata
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\*.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          Push-Location $env:RUNNER_TEMP
          try {
            python -c "import fitz, sys; print(sys.version); print(fitz.VersionBind, fitz.VersionFitz)"
            python -m pytest "$env:GITHUB_WORKSPACE\tests\test_python_compatibility.py" -q
            python -m pytest "$env:GITHUB_WORKSPACE\tests" -q
          } finally {
            Pop-Location
          }

      - name: Upload wheel and build diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PyMuPDF-1.19.6-py${{ matrix.python-version }}-win_amd64
          path: |
            dist/*.whl
            ci/versions.json
            ci-build.log
          if-no-files-found: warn
