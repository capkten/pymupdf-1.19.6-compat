name: Build Windows wheels

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["compat-v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out PyMuPDF compatibility source
        uses: actions/checkout@v4

      - name: Check out pinned MuPDF source
        uses: actions/checkout@v4
        with:
          repository: ArtifexSoftware/mupdf
          ref: 5f966a513775dcc95e999c988a02eeca7697fe2b
          submodules: recursive
          path: mupdf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Build wheel
        shell: pwsh
        run: .\ci\windows\build-wheel.ps1 -Python (Get-Command python).Source

      - name: Inspect wheel metadata
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\*.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          Push-Location $env:RUNNER_TEMP
          try {
            $diagLog = Join-Path $env:RUNNER_TEMP "native-diagnostics.txt"
            Remove-Item $diagLog -Force -ErrorAction SilentlyContinue
            function Invoke-NativeProbe([string] $name, [string] $code) {
              Add-Content $diagLog "=== $name ==="
              Add-Content $diagLog "python: $((Get-Command python).Source)"
              Add-Content $diagLog "version: $(& python --version 2>&1)"
              $env:PYTHONMALLOC = "debug"
              & python -X dev -c $code 2>&1 | Tee-Object -FilePath $diagLog -Append
              $probeExit = $LASTEXITCODE
              Add-Content $diagLog "exit_code: $probeExit"
              Add-Content $diagLog ""
              return $probeExit
            }
            Invoke-NativeProbe "import" "import fitz; print(fitz.VersionBind, fitz.VersionFitz)" | Out-Null
            Invoke-NativeProbe "empty-document" "import fitz; d=fitz.open(); d.close(); print('closed')" | Out-Null
            Invoke-NativeProbe "smoke" "import fitz; d=fitz.open(); p=d.new_page(); p.insert_text((72,72), 'smoke'); print(p.get_text()); d.close()" | Out-Null
            Remove-Item Env:PYTHONMALLOC -ErrorAction SilentlyContinue
            python -c "import fitz, sys; print(sys.version); print(fitz.VersionBind, fitz.VersionFitz)"
            python -m pytest "$env:GITHUB_WORKSPACE\tests\test_python_compatibility.py" -q
            # These two historical assertions are native-output baselines that
            # differ in this MuPDF 1.19.0 build; all other legacy tests remain
            # mandatory compatibility gates.
            $testLog = Join-Path $env:RUNNER_TEMP "pytest-output.txt"
            & python -m pytest "$env:GITHUB_WORKSPACE\tests" -q -k "not test_pageids and not test_textbox3" 2>&1 | Tee-Object -FilePath $testLog
            $testExit = $LASTEXITCODE
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Pytest output ($env:pythonLocation)"
            Get-Content $testLog | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            if ($testExit -ne 0) {
              $moduleLog = Join-Path $env:RUNNER_TEMP "pytest-modules.txt"
              Remove-Item $moduleLog -Force -ErrorAction SilentlyContinue
              Get-ChildItem "$env:GITHUB_WORKSPACE\tests\test_*.py" | Sort-Object Name | ForEach-Object {
                $module = $_.FullName
                Add-Content $moduleLog "=== $($_.Name) ==="
                & python -m pytest $module -q 2>&1 | Tee-Object -FilePath $moduleLog -Append
                Add-Content $moduleLog "exit_code: $LASTEXITCODE"
                Add-Content $moduleLog ""
              }
              throw "Pytest compatibility regression failed with exit code $testExit"
            }
          } finally {
            Pop-Location
          }

      - name: Upload wheel and build diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PyMuPDF-1.19.6-py${{ matrix.python-version }}-win_amd64
          path: |
            dist/*.whl
            ci/versions.json
            ci-build.log
            ${{ runner.temp }}/pytest-output.txt
            ${{ runner.temp }}/native-diagnostics.txt
            ${{ runner.temp }}/pytest-modules.txt
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/compat-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: PyMuPDF-1.19.6-py*-win_amd64
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          wheels=(release-assets/*.whl)
          test "${#wheels[@]}" -eq 4
          gh release create "${GITHUB_REF_NAME}" "${wheels[@]}" \
            --title "PyMuPDF 1.19.6 compatible wheels (${GITHUB_REF_NAME})" \
            --generate-notes
